apiVersion: v1
kind: Namespace
metadata: {name: release-notifier}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: release-notifier, namespace: release-notifier}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: release-notifier, namespace: monitoring}
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: [prometheus, "prometheus:9090"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: release-notifier, namespace: monitoring}
subjects:
  - {kind: ServiceAccount, name: release-notifier, namespace: release-notifier}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: release-notifier}
