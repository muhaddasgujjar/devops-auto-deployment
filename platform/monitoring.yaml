apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pods
  namespace: demo-dev
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pods
  namespace: demo-dev
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pods
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      scrape_timeout: 3s
      evaluation_interval: 5s
    rule_files: [/etc/prometheus/release-alerts.yml]
    scrape_configs:
      - job_name: demo-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [demo-dev]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: release-demo
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
            target_label: revision
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
  release-alerts.yml: |
    groups:
      - name: release-lab-v1
        interval: 5s
        rules:
          - alert: DemoPodsUnavailable
            expr: absent(up{job="demo-pods",namespace="demo-dev"}) or min(up{job="demo-pods",namespace="demo-dev"}) < 1
            for: 30s
            labels: {severity: warning, policy: local-monitoring-v1}
            annotations: {summary: Demo telemetry is absent or a discovered pod cannot be scraped}
          - alert: DemoRequestErrors
            expr: (sum by(revision)(rate(demo_requests_total{namespace="demo-dev",status="500"}[60s])) / sum by(revision)(rate(demo_requests_total{namespace="demo-dev"}[60s]))) > 0.05 and on(revision) sum by(revision)(increase(demo_requests_total{namespace="demo-dev"}[60s])) >= 100
            for: 30s
            labels: {severity: warning, policy: local-monitoring-v1}
            annotations: {summary: A workload revision has sustained HTTP errors; this is not a controller decision}
          - alert: DemoRequestLatency
            expr: histogram_quantile(0.95,sum by(revision,le)(rate(demo_request_duration_seconds_bucket{namespace="demo-dev"}[60s]))) > 0.5 and on(revision) sum by(revision)(increase(demo_requests_total{namespace="demo-dev"}[60s])) >= 100
            for: 30s
            labels: {severity: warning, policy: local-monitoring-v1}
            annotations: {summary: A workload revision has sustained high latency; this is not a recovery verdict}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: release-lab-prometheus
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  storageClassName: release-lab-local
  persistentVolumeReclaimPolicy: Retain
  claimRef: {namespace: monitoring, name: prometheus-data}
  local: {path: /var/lib/release-lab/prometheus}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [k3d-release-lab-server-0]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: release-lab-local
  volumeName: release-lab-prometheus
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
            - --storage.tsdb.retention.size=512MB
            - --web.enable-admin-api
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          persistentVolumeClaim: {claimName: prometheus-data}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: http}
