apiVersion: v1
kind: Namespace
metadata:
  name: release-observer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-observer
  namespace: release-observer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-observer
  namespace: demo-dev
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [rollouts, analysisruns]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-observer
  namespace: demo-dev
subjects:
  - kind: ServiceAccount
    name: release-observer
    namespace: release-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-observer
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [release-demo-dev]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-observer
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: release-observer
    namespace: release-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-observer
