apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: release-demo
  namespace: demo-dev
spec:
  replicas: 2
  # Remove retired ReplicaSets after scale-down; keep evidence in exported trial
  # records. Retained zero-replica scale-down markers can suppress deadline checks
  # in the selected controller. Stable and candidate sets remain controller-owned.
  revisionHistoryLimit: 0
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  selector:
    matchLabels: {app: release-demo}
  strategy:
    blueGreen:
      activeService: demo-stable
      previewService: demo-preview
      autoPromotionEnabled: true
      # Longer than both analysis windows; never cancel post analysis to retire old pods.
      scaleDownDelaySeconds: 600
      scaleDownDelayRevisionLimit: 1
      abortScaleDownDelaySeconds: 30
      prePromotionAnalysis:
        templates:
          - templateName: candidate-health
        args:
          - name: revision
            valueFrom:
              podTemplateHashValue: Latest
      postPromotionAnalysis:
        templates:
          - templateName: serving-health
        args:
          - name: revision
            valueFrom:
              podTemplateHashValue: Latest
  template:
    metadata:
      labels: {app: release-demo}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: __IMAGE__
          env:
            - {name: APP_REVISION, value: "__COMMIT__"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
