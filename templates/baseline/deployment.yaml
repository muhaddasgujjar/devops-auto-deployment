# Separate namespace: do not run competing controllers against one workload.
apiVersion: v1
kind: Namespace
metadata:
  name: demo-baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-demo
  namespace: demo-baseline
spec:
  replicas: 2
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: release-demo}
  template:
    metadata:
      labels: {app: release-demo}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: __IMAGE__
          env:
            - {name: APP_REVISION, value: "__COMMIT__"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: demo-baseline
spec:
  selector: {app: release-demo}
  ports:
    - {name: http, port: 80, targetPort: http}
